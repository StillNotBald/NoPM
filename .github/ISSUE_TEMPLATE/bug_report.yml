name: Bug report
description: Something in NoPM does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. This is the free-tier path for "this doesn't work as documented." For a paid change request, use the "Change request" template instead. For a security vulnerability, do not use this form. See `docs/SECURITY.md` for the private reporting channel.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A clear, short description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, as exact as you can make them.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Hosted demo (stillnotbald.com)
        - Self-hosted (own Supabase project)
        - Own fork
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Affected area
      description: For example a page URL, an API route, a CLI command, or an MCP tool name.
      placeholder: "e.g. /api/tasks, nopm tasks list, /trust page"
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or error text
      description: Paste any error output or attach a screenshot. Do not include tokens, passwords, or API keys.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked this is not a security vulnerability (if it is, see `docs/SECURITY.md` instead).
          required: true
        - label: I did not include any secret, token, or password in this report.
          required: true
